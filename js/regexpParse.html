<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>regexpParse</title>
  <style>
    body {
      background-color: gray;
    }
  </style>
</head>

<body>
  <script>
    function parseRegex(input) {
      let i = 0
      return branchess()
      function onePart() {
        if (input[i] === '(') {
          return Group()
        }
        if (input[i] === '[') {
          return characterClass()
        }
        if (input[i] === '?' || input[i] === '*' || input[i] === '+' || input[i] === '{') {
          return Quantifier()
        }
        return charSinglechar()
      }
      function charSinglechar() {
        let node = {
          type: 'Character',
          start: i,
          end: 0,
          raw: '',
          character: input[i],
        }
        i++
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      function Quantifier() {
        let
      }
      function escapeCharacter() {
        i++
      }
      function characterClass() {
        let node = {
          type: 'characterClass',
          start: i,
          end: 0,
          raw: '',
          invert: false,
          characterclass: []
        }
        i++
        if (input[i] === '^') {
          node.invert = true
        }
        i++
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
        while (i < input.length && input[i] !== ']') {
          let parts = parseclass()
          node.characterclass.push(parts)
        }
        i++
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
        function parseclass() {
          if (input[i] !== '\\') {
            return escapeCharacter()
          } else {
            return charSinglechar()
          }
        }
      }
      function branchess() {
        let bran = []
        while (i < input.length && input[i] !== ')') {
          if (input[i] === '|') {
            i++
            continue
          }
          bran.push(branch())
        }
        return bran
      }
      function branch() {
        let node = {
          type: 'branch',
          start: i,
          end: 0,
          raw: '',
          element: [],
        }
        while (i < input.length && input[i] !== '|' && input[i] !== ')') {
          let ele = onePart()
          node.element.push(ele)
        }
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      function Group() {
        let node = {
          type: 'group',
          start: i,
          end: 0,
          raw: '',
          groupIndex: 0,
          capture: false,
          assert: false,
          positive: null,
          lookhead: null,
          groupName: '',
          branches: [],
        }
        i++
        if (input[i] !== '?') {
          node.branches.push(branch())
          node.capture = true
          i++
          node.end = i
          node.raw = input.slice(node.start, node.end)
          return node
        }
        if (input[i] === '?') {
          i++
          if (input[i] === ':') {
            i++
            node.capture = false
          }
          else if (input[i] === '=') {
            i++
            node.assert = true
            node.positive = true
            node.lookhead = true
          }
          else if (input[i] === '!') {
            i++
            node.assert = true
            node.positive = false
            node.lookhead = true
          }
          else if (input[i] === '<') {
            i++
            if (input[i] === '=') {
              i++
              node.assert = true
              node.positive = true
              node.lookhead = false
            }
            else if (input[i] === '!') {
              i++
              node.assert = true
              node.positive = false
              node.lookhead = false
            }
            else {
              node.capture = true
              let start = i
              while (input[i] !== '>') {
                i++
              }
              node.groupName = input.slice(start, i)
              i++
            }
          }
        }
        node.branches.push(branch())
        if (input[i] === ')') {
          i++
        }
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
    }
  </script>
</body>

</html>
