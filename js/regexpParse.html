<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>regexpParse</title>
  <style>
    body {
      background-color: gray;
    }
  </style>
</head>

<body>
  <svg></svg>
  <script>
    function parseRegex(input) {
      let i = 0
      let groupIndex = 0
      return branchess()
      function onePart() {
        let atom
        if (input[i] === '\\') {
          atom = escape()
        } else if (input[i] === '(') {
          atom = Group()
        } else if (input[i] === '[') {
          atom = characterClass()
        } else {
          atom = charSinglechar()
        }
        if (i < input.length && (input[i] === '?' || input[i] === '*' || input[i] === '+' || input[i] === '{')) {
          return Quantifier(atom)
        }
        return atom
      }
      function charSinglechar() {
        let node = {
          type: 'Character',
          start: i,
          end: 0,
          raw: '',
          character: input[i],
        }
        i++
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      //转义字符
      function escape() {
        let node = {
          type: 'Escape',
          start: i,
          end: 0,
          raw: '',
          escape: '',
        }
        i++
        node.escape = input[i]
        i++
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      function Quantifier(repeatElement) {
        let node = {
          type: 'Quantifier',
          start: repeatElement.start,
          end: 0,
          raw: '',
          min: 0,
          max: Infinity,
          greedy: true,
          repeatElement: repeatElement,
        }
        if (input[i] === '?') {
          i++
          node.max = 1
        } else if (input[i] === '*') {
          i++
        } else if (input[i] === '+') {
          i++
          node.min = 1
        } else if (input[i] === '{') {
          i++
          let start = i
          while (input[i] !== ',' && input[i] !== '}') {
            i++
          }
          node.min = Number(input.slice(start, i))
          if (input[i] === '}') {
            node.max = node.min
            i++
          } else if (input[i] === ',') {
            i++
            start = i
            while (i < input.length && input[i] !== '}') {
              i++
            }
            if (start === i) {
              node.max = Infinity
            } else {
              node.max = Number(input.slice(start, i))
            }
            if (input[i] === '}') {
              i++
            }
          }
        }
        //非贪婪匹配
        if (input[i] === '?') {
          node.greedy = false
          i++
        }
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      function classPart() {
        if (input[i] === '\\') {
          return escape()
        }
        return charSinglechar()
      }
      function characterClass() {
        let node = {
          type: 'CharacterClass',
          start: i,
          end: 0,
          raw: '',
          invert: false,
          characterclass: []
        }
        i++
        if (input[i] === '^') {
          node.invert = true
          i++
        }
        while (i < input.length && input[i] !== ']') {
          node.characterclass.push(classPart())
        }
        if (input[i] === ']') {
          i++
        }
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      function branchess() {
        let bran = []
        while (i < input.length && input[i] !== ')') {
          if (input[i] === '|') {
            i++
            continue
          }
          bran.push(branch())
        }
        return bran
      }
      function branch() {
        let node = {
          type: 'Branch',
          start: i,
          end: 0,
          raw: '',
          element: [],
        }
        while (i < input.length && input[i] !== '|' && input[i] !== ')') {
          let ele = onePart()
          node.element.push(ele)
        }
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      function Group() {
        let node = {
          type: 'Group',
          start: i,
          end: 0,
          raw: '',
          groupIndex: 0,
          capture: false,
          assert: false,
          positive: null,
          lookhead: null,
          groupName: '',
          branches: [],
        }
        i++
        if (input[i] === '?') {
          i++
          if (input[i] === ':') {
            i++
            node.capture = false
          }
          else if (input[i] === '=') {
            i++
            node.assert = true
            node.positive = true
            node.lookhead = true
          }
          else if (input[i] === '!') {
            i++
            node.assert = true
            node.positive = false
            node.lookhead = true
          }
          else if (input[i] === '<') {
            i++
            if (input[i] === '=') {
              i++
              node.assert = true
              node.positive = true
              node.lookhead = false
            }
            else if (input[i] === '!') {
              i++
              node.assert = true
              node.positive = false
              node.lookhead = false
            }
            else {
              node.capture = true
              let start = i
              while (input[i] !== '>') {
                i++
              }
              node.groupName = input.slice(start, i)
              i++
            }
          }
        } else {
          node.capture = true
          groupIndex++
          node.groupIndex = groupIndex
        }
        node.branches.push(branch())
        while (i < input.length && input[i] === '|') {
          i++
          node.branches.push(branch())
        }
        if (input[i] === ')') {
          i++
        }
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
    }
    function draw(node) {
      if (node.type === 'Character') {
        return drawcharSinglechar(node)
      }
      if (node.type === 'Escape') {
        return drawescape(node)
      }
      if (node.type === 'Quantifier') {
        return drawQuantifier(node)
      }
      if (node.type === 'CharacterClass') {
        return drawcharacterClass(node)
      }
      if (node.type === 'Branch') {
        return drawbranch(node)
      }
      if (node.type === 'Group') {
        return drawGroup(node)
      }
    }
    let svg = document.querySelector('svg')
    svg.setAttribute('width', '1000')
    svg.setAttribute('height', '1000')
    function drawcharSinglechar(node) {
      let width = 20
      let height = 20
      let g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      let rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
      rect.setAttribute('width', width)
      rect.setAttribute('height', height)
      rect.setAttribute('rx', '5')
      rect.setAttribute('ry', '5')
      rect.setAttribute('fill', 'blue')
      rect.setAttribute('stroke', 'green')
      rect.setAttribute('stroke-width', '1')
      let text = document.createElementNS('http://www.w3.org/2000/svg', 'text')
      text.setAttribute('x', width / 2)
      text.setAttribute('y', height / 2)
      text.setAttribute('text-anchor', 'middle')
      text.setAttribute('dominant-baseline', 'central')
      text.setAttribute('font-size', '10')
      text.textContent = node.character
      g.appendChild(rect)
      g.appendChild(text)
      //g.setAttribute('transform', 'translate(50, 50)')
      //svg.appendChild(g)
      return {
        ele: g,
        width: width,
        height: height,
      }
    }
    function drawescape(node) {

    }
    function drawQuantifier(node) {

    }
    function drawcharacterClass(node) {

    }
    function drawbranchess(node) {
      let g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      let gap = 20
      let x = 0
      let y = 0
      let H = 0
      let W = 0
      let branchess = []
      for (let i = 0; i < node.length; i++) {
        let childc = drawbranch(node[i])
        branchess.push(childc)
        if (childc.width > W) {
          W = childc.width
        }
        if (i !== node.length - 1) {
          H += childc.height + gap
        } else {
          H += childc.height
        }
      }
      for (let i = 0; i < branchess.length; i++) {
        let childc = branchess[i]
        let child = childc.ele
        child.setAttribute('transform', `translate(${gap + (W - childc.width) / 2}, ${y})`)
        g.appendChild(child)
        if (i !== branchess.length - 1) {
          y += childc.height + gap
        } else {
          y += childc.height
        }
      }
      g.setAttribute('transform', 'translate(50, 50)')
      svg.appendChild(g)
      return {
        ele: g,
        width: W + gap * 2,
        height: H
      }
    }
    function drawbranch(node) {
      let g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      let gap = 20
      let x = 0
      let H = 0
      let W = 0
      for (let i = 0; i < node.element.length; i++) {
        let childc = draw(node.element[i])
        if (childc.height > H) {
          H = childc.height
        }
        let child = childc.ele
        child.setAttribute('transform', `translate(${x}, 0)`)
        g.appendChild(child)
        if (i !== node.element.length - 1) {
          let line = document.createElementNS('http://www.w3.org/2000/svg', 'line')
          line.setAttribute('x1', x + childc.width)
          line.setAttribute('y1', childc.height / 2)
          line.setAttribute('x2', x + childc.width + gap)
          line.setAttribute('y2', childc.height / 2)
          line.setAttribute('stroke', 'red')
          line.setAttribute('stroke-width', 1)
          g.appendChild(line)
          x += childc.width + gap
        } else {
          x += childc.width
        }
      }
      return {
        ele: g,
        width: x,
        height: H,
      }
    }
    function drawGroup(node) {
      let g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      let branch = draw(node.branches[0])
      let rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
      let padding = 1
      rect.setAttribute('x', -1)
      rect.setAttribute('y', -1)
      rect.setAttribute('width', branch.width - 24)
      rect.setAttribute('height', branch.height + 2)
      rect.setAttribute('fill', 'yellow')
      g.appendChild(rect)
      g.appendChild(branch.g)
      return {
        ele: g,
        width: branch.width + 2,
        height: branch.height + 2
      }
    }
  </script>
</body>
