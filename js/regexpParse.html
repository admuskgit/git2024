<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>regexpParse</title>
  <style>
    body {
      background-color: gray;
    }
  </style>
</head>

<body>
  <svg></svg>
  <script>
    function parseRegex(input) {
      let i = 0
      let groupIndex = 0
      return branchess()
      function onePart() {
        let atom
        if (input[i] === '\\') {
          atom = escape()
        } else if (input[i] === '(') {
          atom = Group()
        } else if (input[i] === '[') {
          atom = characterClass()
        } else {
          atom = charSinglechar()
        }
        if (i < input.length && (input[i] === '?' || input[i] === '*' || input[i] === '+' || input[i] === '{')) {
          return Quantifier(atom)
        }
        return atom
      }
      function charSinglechar() {
        let node = {
          type: 'Character',
          start: i,
          end: 0,
          raw: '',
          character: input[i],
        }
        i++
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      //转义字符
      function escape() {
        let node = {
          type: 'Escape',
          start: i,
          end: 0,
          raw: '',
          escape: '',
        }
        i++
        node.escape = input[i]
        i++
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      function Quantifier(repeatElement) {
        let node = {
          type: 'Quantifier',
          start: repeatElement.start,
          end: 0,
          raw: '',
          min: 0,
          max: Infinity,
          greedy: true,
          repeatElement: repeatElement,
        }
        if (input[i] === '?') {
          i++
          node.max = 1
        } else if (input[i] === '*') {
          i++
        } else if (input[i] === '+') {
          i++
          node.min = 1
        } else if (input[i] === '{') {
          i++
          let start = i
          while (input[i] !== ',' && input[i] !== '}') {
            i++
          }
          node.min = Number(input.slice(start, i))
          if (input[i] === '}') {
            node.max = node.min
            i++
          } else if (input[i] === ',') {
            i++
            start = i
            while (i < input.length && input[i] !== '}') {
              i++
            }
            if (start === i) {
              node.max = Infinity
            } else {
              node.max = Number(input.slice(start, i))
            }
            if (input[i] === '}') {
              i++
            }
          }
        }
        //非贪婪匹配
        if (input[i] === '?') {
          node.greedy = false
          i++
        }
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      function classPart() {
        if (input[i] === '\\') {
          return escape()
        }
        return charSinglechar()
      }
      function characterClass() {
        let node = {
          type: 'characterClass',
          start: i,
          end: 0,
          raw: '',
          invert: false,
          characterclass: []
        }
        i++
        if (input[i] === '^') {
          node.invert = true
          i++
        }
        while (i < input.length && input[i] !== ']') {
          node.characterclass.push(classPart())
        }
        if (input[i] === ']') {
          i++
        }
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      function branchess() {
        let bran = []
        while (i < input.length && input[i] !== ')') {
          if (input[i] === '|') {
            i++
            continue
          }
          bran.push(branch())
        }
        return bran
      }
      function branch() {
        let node = {
          type: 'branch',
          start: i,
          end: 0,
          raw: '',
          element: [],
        }
        while (i < input.length && input[i] !== '|' && input[i] !== ')') {
          let ele = onePart()
          node.element.push(ele)
        }
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      function Group() {
        let node = {
          type: 'group',
          start: i,
          end: 0,
          raw: '',
          groupIndex: 0,
          capture: false,
          assert: false,
          positive: null,
          lookhead: null,
          groupName: '',
          branches: [],
        }
        i++
        if (input[i] === '?') {
          i++
          if (input[i] === ':') {
            i++
            node.capture = false
          }
          else if (input[i] === '=') {
            i++
            node.assert = true
            node.positive = true
            node.lookhead = true
          }
          else if (input[i] === '!') {
            i++
            node.assert = true
            node.positive = false
            node.lookhead = true
          }
          else if (input[i] === '<') {
            i++
            if (input[i] === '=') {
              i++
              node.assert = true
              node.positive = true
              node.lookhead = false
            }
            else if (input[i] === '!') {
              i++
              node.assert = true
              node.positive = false
              node.lookhead = false
            }
            else {
              node.capture = true
              let start = i
              while (input[i] !== '>') {
                i++
              }
              node.groupName = input.slice(start, i)
              i++
            }
          }
        } else {
          node.capture = true
          groupIndex++
          node.groupIndex = groupIndex
        }
        node.branches.push(branch())
        while (i < input.length && input[i] === '|') {
          i++
          node.branches.push(branch())
        }
        if (input[i] === ')') {
          i++
        }
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
    }
    const svg = document.querySelector('svg')
    function createSVG(tagName, attrs = {}, children = []) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tagName)
      for (const [key, value] of Object.entries(attrs)) {
        el.setAttribute(key, value)
      }
      children.forEach(it => el.appendChild(it))
      return el
    }
    function draw(node) {
      if (node.type === 'Character') {
        return drawcharSinglechar(node)
      }
      if (node.type === 'Escape') {
        return drawescape(node)
      }
      if (node.type === 'Quantifier') {
        return drawQuantifier(node)
      }
      if (node.type === 'characterClass') {
        return drawcharacterClass(node)
      }
      if (node.type === 'branch') {
        return drawbranch(node)
      }
      if (node.type === 'Group') {
        return drawGroup(node)
      }
    }
    function drawcharSinglechar(node) {
      const strokeWidth = 10
      const text = createSVG('text', {
        'font-size': '100px',
        'font-family': 'Consolas, Menlo, monospace',
        'fill': 'red',
        'dominant-baseline': 'central',//垂直居中 配合height/2
        'text-anchor': 'middle',//水平居中 配合width/2
      })
      text.textContent = node.character
      const rect = createSVG('rect', {
        rx: 5,
        ry: 5,
        fill: 'yellow',
        stroke: 'green',
        'stroke-width': strokeWidth
      })
      const g = createSVG('g', { class: 'character-node' }, [rect, text])
      svg.appendChild(g)
      const bbox = text.getBBox()
      const width = Math.max(bbox.width + 40, 60)
      const height = bbox.height + 10
      rect.setAttribute('width', width)
      rect.setAttribute('height', height)
      text.setAttribute('x', width / 2)
      text.setAttribute('y', height / 2)
      return {
        el: g,
        width: width + strokeWidth,
        height: height + strokeWidth,
        y: (height + strokeWidth) / 2
      }
    }

    function drawcharacterClass(node) {

    function drawbranchess(node) {

    function drawbranch(node) {

    function drawGroup(node) {

    }
    function render(ast) {
      svg.innerHTML = ''
      const rootNode = Array.isArray(ast) ? ast[0] : ast
      const result = draw(rootNode)
      const MARGIN = 20
      result.el.setAttribute('transform', `translate(${MARGIN - 15}, ${MARGIN - 15})`)
      const svgWidth = result.width + MARGIN * 2
      const svgHeight = result.height + MARGIN * 2
      svg.setAttribute('width', svgWidth)
      svg.setAttribute('height', svgHeight)
    }
  </script>
</body>

</html>
