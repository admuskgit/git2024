<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>image-download-onebyone</title>
  <style>
    body {
      background: gray;
    }
  </style>
</head>

<body>
  <script>
    function downloadImage(url, callback) {
      let img = new Image()
      img.onload = function () {
        callback(img)
      }
      img.onerror = function () {
        callback(img)
      }
      img.src = url
    }
    function get(URL, callback) {
      let xhr = new XMLHttpRequest()
      xhr.open('GET', URL)
      xhr.onload = function () { callback(xhr) }
      xhr.send()
    }
    //两个两个下载，都下载完才开始下一轮
    function downloadTwoByTwo(done) {
      get('https://xieranmaya.github.io/images/cats/cats.json',
        function callback(xhr) {
          let cats = JSON.parse(xhr.responseText)
          let i = 0
          function next() {
            let count = 0
            downloadImage(cats[i].fullUrl, function (img) {
              count++
              if (count === 2) {
                i += 2
                next()
              }
            })
            downloadImage(cats[i + 1].fullUrl, function (img) {
              count++
              if (count === 2) {
                i += 2
                next()
              }
            })
          }
          next()
        }
      )
    }
    downloadTwoByTwo(function () { console.log('全部下载完成') })
    function downloadOneByone(done) {
      get('https://xieranmaya.github.io/images/cats/cats.json',
        function callback(xhr) {
          let cats = JSON.parse(xhr.responseText)
          let i = 0
          function next() {
            if (i < cats.length) {
              downloadImage(cats[i].fullUrl, function (img) {
                i++
                next()
              })
            } else {
              done()
            }
          }
          next()
        }
      )
    }
    //downloadOneByone(function () { console.log('全部下载完成') })

  </script>
</body>

</html>
