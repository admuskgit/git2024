    function downloadImage(url, callback) {
      let img = new Image()

        callback(img)

      img.onerror = function () {

      }

    //一个一个下载
    function downloadOneByone(callback) {
      let xhr = new XMLHttpRequest()
      xhr.open('GET', 'https://xieranmaya.github.io/images/cats/cats.json')
      xhr.onload = function () {
        let cats = JSON.parse(xhr.responseText)
        let i = 0
        function next() {
          if (i < cats.length) {
            downloadImage(cats[i].fullUrl, function (img) {
              i++
              next()
            })
          } else {
            callback()
          }
        }
        next()
      }
      xhr.send()
    }

    class mulTaskQueue {
      constructor(parallelLimit = 3) {
        this._parallelLimit = parallelLimit
        this._tasks = []
        this._runing = 0
      }
      addTask(add) {
        if (this._runing < this._parallelLimit) {
          this._runing++
          let self = this
          add(function next() {
            self._runing--
            self.run()
          })
        } else {
          this._tasks.push(add)
        }
        return this
      }
      run() {
        let task = this._tasks.shift()
        if (!task) return
        let self = this
        task(function next() {
          self.run()
        })
      }
    }
