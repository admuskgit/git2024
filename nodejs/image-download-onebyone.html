    function downloadImage(url, callback) {
      let img = new Image()
      img.onload = function () {
        callback(img)
      }
      img.onerror = function () {
        callback(img)
      }
      img.src = url
    }
    function get() {

    }
    //一个一个下载
    function downloadOneByone(callback) {
      let xhr = new XMLHttpRequest()
      xhr.open('GET', 'https://xieranmaya.github.io/images/cats/cats.json')
      xhr.onload = function () {
        let cats = JSON.parse(xhr.responseText)
        let i = 0
        function next() {
          if (i < cats.length) {
            downloadImage(cats[i].fullUrl, function (img) {
              i++
              next()
            })
          } else {
            callback()
          }
        }
        next()
      }
      xhr.send()
    }
