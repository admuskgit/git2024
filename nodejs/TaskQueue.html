<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskQueue</title>
  <style>
    body {
      background: gray;
    }
  </style>
</head>

<body>
  <script>
    class TaskQueue {
      constructor(parallelLimit = 1) {
        this._parallelLimit = parallelLimit
        this._tasks = []
        this._runing = 0
      }
      addTask(add) {
        this._tasks.push(add)
        return this
      }
      run() {
        let task = this._tasks.shift()
        if (!task) return
        let self = this
        task(function next() {
          console.log('打印完成')
          self.run()
        })
      }
    }
    let tq = new TaskQueue()
    tq.addTask(function task(next) {
      setTimeout(() => { console.log(1); next() }, 3000)
    }).addTask(function task(next) {
      setTimeout(() => { console.log(2); next() }, 2000)
    }).addTask(function task(next) {
      setTimeout(() => { console.log(3); next() }, 2000)
    }).addTask(function task(next) {
      setTimeout(() => { console.log(4); next() }, 2000)
    }).addTask(function task(next) {
      setTimeout(() => { console.log(5); next() }, 2000)
    }).addTask(function task(next) {
      setTimeout(() => { console.log(6); next() }, 1000)
    })
    //tq.run()
    //多线程
    class mulTaskQueue {
      constructor(parallelLimit = 2) {
        this._parallelLimit = parallelLimit
        this._tasks = []
        this._runing = 0
      };
      addTask(task) {
        console.log('addTask之前', this._runing);
        if (this._runing < this._parallelLimit) {
          this._runing++
          console.log('启动任务', this._runing)
          let self = this
          task(function next() {
            self._runing--
            console.log('任务结束', self._runing)
            self.run()
          })
        } else {
          this._tasks.push(task)
        }
        return this
      };
      run() {
        console.log('run', this._runing, this._tasks.length)
        //this._runing++ 放这里不对
        let waitingTask = this._tasks.shift()
        if (!waitingTask) return
        this._runing++//有任务，才加1.
        let self = this
        waitingTask(function next() {//这个next函数，是task里的回调.我既然走到task这里了，说明我需要一个任务，已经在外面++了，这个--是在回调里面，我既然走到了回调，说明task结束，先--，在开启下一个.
          self._runing--
          self.run()
        })
      };
    }
    let tq1 = new mulTaskQueue()
    tq1.addTask(function task(next) {
      setTimeout(() => { console.log(1); next() }, 1000)
    }).addTask(function task(next) {
      setTimeout(() => { console.log(2); next() }, 1000)
    }).addTask(function task(next) {
      setTimeout(() => { console.log(3); next() }, 1000)
    }).addTask(function task(next) {
      setTimeout(() => { console.log(4); next() }, 1000)
    }).addTask(function task(next) {
      setTimeout(() => { console.log(5); next() }, 1000)
    }).addTask(function task(next) {
      setTimeout(() => { console.log(6); next() }, 1000)
    })
  </script>
</body>

</html>
