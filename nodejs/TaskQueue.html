<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskQueue</title>
  <style>
    body {
      background: gray;
    }
  </style>
</head>

<body>
  <script>

    class TaskQueue {
      constructor(parallelLimit = 1) {
        this.parallelLimit = parallelLimit
        this.tasks = []
      }
      addTask(add) {
        this.tasks.push(add)
        return this
      }
      run() {
        let task = this.tasks.shift()
        if (!task) return
        let self = this
        task(function next() {
          console.log('打印完成')
          self.run()
        })
        //箭头函数
        // task(() => {
        //   console.log('打印完成')
        //   this.run()
        // })
      }
    }
    let tq = new TaskQueue()
    tq.addTask(function task(next) {
      setTimeout(() => { console.log(1); next() }, 1000)
    }).addTask(function task(next) {
      setTimeout(() => { console.log(2); next() }, 1000)
    }).addTask(function task(next) {
      setTimeout(() => { console.log(3); next() }, 1000)
    }).addTask(function task(next) {
      setTimeout(() => { console.log(4); next() }, 1000)
    }).addTask(function task(next) {
      setTimeout(() => { console.log(5); next() }, 1000)
    }).addTask(function task(next) {
      setTimeout(() => { console.log(6); next() }, 1000)
    })
    tq.run()
  </script>
</body>

</html>
