  <script>
    class TaskQueue {
      constructor(parallelLimit = 1) {
        this._parallelLimit = parallelLimit
        this._tasks = []
        this._runing = 0
      }
      addTask(add) {
        this._tasks.push(add)
        return this
      }
      run() {
        let task = this._tasks.shift()
        if (!task) return
        let self = this
        task(function next() {
          console.log('打印完成')
          self.run()
        })
      }
    }
    let tq = new TaskQueue()
    tq.addTask(function task(next) {
      setTimeout(() => { console.log(1); next() }, 3000)

    })

    //多线程
    class mulTaskQueue {
      constructor(parallelLimit = 3) {
        this._parallelLimit = parallelLimit
        this._tasks = []
        this._runing = 0
      }
      addTask(add) {
        if (this._runing < this._parallelLimit) {
          this._runing++
          let self = this
          add(function next() {
            self._runing--
            self.run()
          })
        } else {
          this._tasks.push(add)
        }
        return this
      }
      run() {
        let task = this._tasks.shift()
        if (!task) return
        let self = this
        task(function next() {
          self.run()
        })
      }
    }
