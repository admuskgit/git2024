<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>setTimeout</title>
</head>
<body>
  <script>
    document.body.style.background = "blue"
    setTimeout(function() {
      document.body.style.background = "yellow"
    }, 2000)
  </script>
</body>
</html>
