<p style="text-align: center; margin-top: 300px;">
  <img src="https://upload.wikimedia.org/wikipedia/commons/7/74/Cat_August_2010-3.jpg" style="position: relative; width: 200px;">
</p>
<script>
  var cat = document.querySelector("img")
  var angle = 0, lastTime = null
  function animate(time) {
    if (lastTime != null) {
      angle += (time - lastTime) * 0.0015
    }
    lastTime = time
    cat.style.top = (Math.sin(angle) * 200) + "px"
    cat.style.left = (Math.cos(angle) * 400) + "px"
    requestAnimationFrame(animate)
  }
  requestAnimationFrame(animate)
</script>
